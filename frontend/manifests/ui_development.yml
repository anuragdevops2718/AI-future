apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ai
  template:
    metadata:
      labels:
        app: frontend-ai
    spec:
      containers:
        - name: ai-frontend
          image: devacraifuture.azurecr.io/frontend:eb4a7573f93b78bf5eb22da6d0f50bdd9b1e00f0
          imagePullPolicy: Always
          ports:
            - containerPort: 80