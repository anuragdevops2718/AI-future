name: "Terraform: Azure Landing Zone (Dev)"

on:
  push:
    branches:
      - main
      - 'features/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  terraform:
    name: "Terraform Deploy (Dev)"
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_sql_admin_password: ${{ secrets.TF_SQL_ADMIN_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.0

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select Azure Subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az account show

      - name: Export ARM_* environment vars
        run: |
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./infrastructure_micro_landing_zone/environment/dev
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -input=false

      - name: Terraform Validate
        working-directory: ./infrastructure_micro_landing_zone/environment/dev
        run: terraform validate



      - name: Terraform Plan
        id: plan
        working-directory: ./infrastructure_micro_landing_zone/environment/dev
        run: terraform plan 


      - name: Terraform Apply (only on main branch)
        if: github.ref == 'refs/heads/main'
        working-directory: ./infrastructure_micro_landing_zone/environment/dev
        run: terraform apply -input=false -auto-approve tfplan

