apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-get-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-get-ai
  template:
    metadata:
      labels:
        app: backend-get-ai
    spec:
      containers:
        - name: backend-get-ai
          image: devacrai11.azurecr.io/backend_get:fa164dc4285e7be1cdb7d1afd1f5b94f635eedac
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          envFrom:
          - secretRef:
              name: supabase-secret