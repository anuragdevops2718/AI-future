apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ai
  template:
    metadata:
      labels:
        app: frontend-ai
    spec:
      containers:
        - name: ai-frontend
          image: devacrai11.azurecr.io/frontend:553d6ff931a9d9dcceba03301905379e6e65132f
          imagePullPolicy: Always
          ports:
            - containerPort: 80