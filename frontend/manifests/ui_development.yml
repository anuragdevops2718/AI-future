apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ai
  template:
    metadata:
      labels:
        app: frontend-ai
    spec:
      containers:
        - name: ai-frontend
          image: devacraifuture.azurecr.io/frontend:720d2f978d5ede0a6f9503d79d56a857e7a51660
          imagePullPolicy: Always
          ports:
            - containerPort: 80