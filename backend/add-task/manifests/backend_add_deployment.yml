apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-add-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-add-ai
  template:
    metadata:
      labels:
        app: backend-add-ai
    spec:
      containers:
        - name: backend-add-ai
          image: devacrai11.azurecr.io/backend_add:b6072477263b94c77c2a70e58d378202b345f4ad
          imagePullPolicy: Always
          ports:
            - containerPort: 5001