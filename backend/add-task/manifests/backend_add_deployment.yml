apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-add-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-add-ai
  template:
    metadata:
      labels:
        app: backend-add-ai
    spec:
      containers:
        - name: backend-add-ai
          image: devacrai11.azurecr.io/backend_add:e7ae8fc86ebe4bc51933a5e9184d5fae401fef96
          imagePullPolicy: Always
          ports:
            - containerPort: 5000