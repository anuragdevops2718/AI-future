apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-get-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-get-ai
  template:
    metadata:
      labels:
        app: backend-get-ai
    spec:
      containers:
        - name: backend-get-ai
          image: devacrai11.azurecr.io/backend_get:470369509ba2b13941aef85ec086f036e6521519
          imagePullPolicy: Always
          ports:
            - containerPort: 5000