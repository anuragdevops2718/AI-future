apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-add-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-add-ai
  template:
    metadata:
      labels:
        app: backend-add-ai
    spec:
      containers:
        - name: backend-add-ai
          image: devacrai11.azurecr.io/backend_add:553d6ff931a9d9dcceba03301905379e6e65132f
          imagePullPolicy: Always
          ports:
            - containerPort: 5000