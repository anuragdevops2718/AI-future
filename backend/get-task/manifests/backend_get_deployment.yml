apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-get-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-get-ai
  template:
    metadata:
      labels:
        app: backend-get-ai
    spec:
      containers:
        - name: backend-get-ai
          image: devacraifuture.azurecr.io/backend_get:e1ed44b190871e270f93567bb91fc116d0a6aab3
          imagePullPolicy: Always
          ports: 
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: sql-connection-secret
          env:
            - name: SERVICE_NAME
              value: "tasks"