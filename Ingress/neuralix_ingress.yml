apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuralixapp-ingress
  annotations:
    kubernetes.io/ingress.class: "azure-application-gateway"
    # HTTPS force nahi kar rahe abhi
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: "azure-application-gateway"
  rules:
    - host: neuralixapp.apforge.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc-ai
                port:
                  number: 9000
