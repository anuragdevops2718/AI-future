apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-get-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-get-ai
  template:
    metadata:
      labels:
        app: backend-get-ai
    spec:
      containers:
        - name: backend-get-ai
          image: devacraifuture.azurecr.io/backend_get:13f032cadf3163c0ff3bf9678dd0136fa6f1ed11
          imagePullPolicy: Always
          ports: 
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: sql-connection-secret
          env:
            - name: SERVICE_NAME
              value: "tasks"